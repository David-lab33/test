<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetHub - Cart</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/root.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/media.css">
</head>
<body>

    <header>
        <div class="container">
            <div class="row">
                <div class="col col-12">
                    <div class="wrapper header-wrapper">
                        <nav class="nav-bar">
                            <a href="index.html" class="logo"><i class="fa-solid fa-paw"></i> PetHub</a>
                            <ul class="nav-links">
                                <li><a href="index.html">Home</a></li>
                                <li><a href="products.html">Products</a></li>
                                <li><a href="cart.html">Basket</a></li>
                                <li><a href="login.html">Login</a></li>
                                <li><a href="register.html">Register</a></li>
                            </ul>
                            <div class="search-box">
                                <input type="text" placeholder="Search...">
                                <button type="submit"><i class="fa-solid fa-magnifying-glass"></i></button>
                            </div>
                        </nav>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main>
        <section class="cart-section">
            <div class="container">
                <h2 class="section-title">Your Cart</h2>
                <div class="row">
                    <div class="col col-8">
                        <div class="wrapper contact-card">
                            <div class="row">
                                <div class="col col-3">
                                    <img src="https://images.unsplash.com/photo-1522276498395-f4f68f7f8454?w=150" alt="Orange Parrot">
                                </div>
                                <div class="col col-4">
                                    <strong>Orange Parrot</strong>
                                </div>
                                <div class="col col-3">
                                    <span>$300.00</span>
                                </div>
                                <div class="col col-2">
                                    <button class="btn btn-primary"><i class="fa-solid fa-trash"></i></button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col col-4">
                        <div class="wrapper contact-card">
                            <h3>Order Summary</h3>
                            <p>Subtotal: <strong>$300.00</strong></p>
                            <p>Shipping: <strong>$10.00</strong></p>
                            <p>Total: <strong>$310.00</strong></p>
                            <button class="btn btn-accent w-100">Checkout</button>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <div class="row">
                <div class="col col-12">
                    <div class="wrapper">
                        <p>&copy; 2026 PetHub. All rights reserved.</p>
                    </div>
                </div>
            </div>
        </div>
    </footer>

</body>
</html>
